<rect x="0" y="0" width="1100" height="640" style="fill:#ffffff"/>
<g style="font-family:sans-serif;fill:#222222">
<text x="40" y="48" style="font-size:26px;font-weight:bold">A Spectre tile from four shapes</text>
<text x="40" y="72" style="font-size:13px;fill:#555555">Lengths are in tile edges (the Spectre has 14 edges of length 1). The tile outline has a regular hexagon on every edge.</text>
<text x="170" y="132" style="font-size:18px;font-weight:bold">Triangle  × 61</text>
<text x="170" y="154" style="font-size:13px">equilateral, side 1/2</text>
<text x="170" y="173" style="font-size:13px;fill:#555555">60° 60° 60°</text>
<path d="M 45.000 190.000 L 145.000 190.000 L 95.000 103.397 Z" style="fill:#4a7fe0;stroke:#222222;stroke-width:1.5;stroke-linejoin:round"/>
<text x="170" y="250" style="font-size:18px;font-weight:bold">Half triangle  × 23</text>
<text x="170" y="272" style="font-size:13px">sides 1/4, √3/4, 1/2</text>
<text x="170" y="291" style="font-size:13px;fill:#555555">30° 60° 90°  (triangle cut down the middle)</text>
<path d="M 45.000 308.000 L 95.000 308.000 L 45.000 221.397 Z" style="fill:#f5a03a;stroke:#222222;stroke-width:1.5;stroke-linejoin:round"/>
<text x="170" y="368" style="font-size:18px;font-weight:bold">Small triangle  × 10</text>
<text x="170" y="390" style="font-size:13px">sides 1/8, √3/8, 1/4</text>
<text x="170" y="409" style="font-size:13px;fill:#555555">30° 60° 90°  (top half of the half triangle)</text>
<path d="M 45.000 426.000 L 70.000 426.000 L 45.000 382.699 Z" style="fill:#12a5a8;stroke:#222222;stroke-width:1.5;stroke-linejoin:round"/>
<text x="170" y="486" style="font-size:18px;font-weight:bold">Trapezoid  × 1</text>
<text x="170" y="508" style="font-size:13px">parallel sides 1/4 and 1/8, height √3/8, slant 1/4</text>
<text x="170" y="527" style="font-size:13px;fill:#555555">90° 90° 120° 60°  (bottom half of the half triangle)</text>
<path d="M 45.000 544.000 L 95.000 544.000 L 70.000 500.699 L 45.000 500.699 Z" style="fill:#9b59d0;stroke:#222222;stroke-width:1.5;stroke-linejoin:round"/>
<text x="575" y="610" style="font-size:14px">95 pieces cover 97.9% of the tile; the pale slivers are still open.</text>
</g>
