<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1100" height="640" viewBox="0 0 1100 640">
<rect id="background" x="0" y="0" width="1100" height="640" style="fill:#ffffff"/>
<g inkscape:groupmode="layer" inkscape:label="Text" id="layer-text" style="font-family:sans-serif;fill:#222222">
<text id="title" x="40" y="48" style="font-size:26px;font-weight:bold">A Spectre tile from four shapes</text>
<text id="subtitle" x="40" y="72" style="font-size:13px;fill:#555555">Lengths are in tile edges (the Spectre has 14 edges of length 1). The tile outline has a regular hexagon on every edge.</text>
<text id="name_tri" x="170" y="132" style="font-size:18px;font-weight:bold">Triangle  × 61</text>
<text id="sides_tri" x="170" y="154" style="font-size:13px">equilateral, side 1/2</text>
<text id="angles_tri" x="170" y="173" style="font-size:13px;fill:#555555">60° 60° 60°</text>
<text id="name_half" x="170" y="250" style="font-size:18px;font-weight:bold">Half triangle  × 23</text>
<text id="sides_half" x="170" y="272" style="font-size:13px">sides 1/4, √3/4, 1/2</text>
<text id="angles_half" x="170" y="291" style="font-size:13px;fill:#555555">30° 60° 90°  (triangle cut down the middle)</text>
<text id="name_small" x="170" y="368" style="font-size:18px;font-weight:bold">Small triangle  × 10</text>
<text id="sides_small" x="170" y="390" style="font-size:13px">sides 1/8, √3/8, 1/4</text>
<text id="angles_small" x="170" y="409" style="font-size:13px;fill:#555555">30° 60° 90°  (top half of the half triangle)</text>
<text id="name_trap" x="170" y="486" style="font-size:18px;font-weight:bold">Trapezoid  × 1</text>
<text id="sides_trap" x="170" y="508" style="font-size:13px">parallel sides 1/4 and 1/8, height √3/8, slant 1/4</text>
<text id="angles_trap" x="170" y="527" style="font-size:13px;fill:#555555">90° 90° 120° 60°  (bottom half of the half triangle)</text>
<text id="summary" x="575" y="610" style="font-size:14px">95 pieces cover 97.9% of the tile; the pale slivers are still open.</text>
</g>
